[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "otwarte-dane-api"
version = "0.1.0"
description = "Python client for the DANE.GOV.PL Open Data API (OpenAPI 1.4)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "otwarte-dane-api contributors" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5",
    "typing-extensions>=4.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/otwarte_dane_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
